name: Docker Publish

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Mission Management
        uses: docker/build-push-action@v5
        with:
          context: ./mission-management
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mission-management:latest

      - name: Build and Push Land Management
        uses: docker/build-push-action@v5
        with:
          context: ./land-management
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/land-management:latest

      - name: Build and Push Nursery School
        uses: docker/build-push-action@v5
        with:
          context: ./nursery-school
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nursery-school:latest